[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-finetune-eval"
version = "0.1.0"
description = "Learning project: LoRA fine-tune of Qwen2.5-0.5B-Instruct on CPU for contract-clause classification, compared with the base model through the llm-eval-lab regression gate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "torch>=2.3",
  "transformers>=4.45",
  "peft>=0.12",
  "huggingface_hub>=0.24",
  "pyarrow>=15",
  "numpy>=1.26",
  "pyyaml>=6",
  "llm-eval-lab @ git+https://github.com/vk-ai/llm-eval-lab@df9768b7eb1adeffc7a843aaae0fe5008b74b63d",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lfe = "llm_finetune_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
